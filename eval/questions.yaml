# Evaluation set (spec section 12).
#
# PROVENANCE: these questions were written against the sample corpus in
# fixtures/repo (the fictional product "Atlas") so the harness is runnable before
# real credentials exist. REPLACE THEM with 30+ real marketer questions and real
# engineer answers before trusting the numbers. See docs/DECISIONS.md.
#
# Fields:
#   q               the question, phrased the way a marketer would ask
#   should_answer   false  -> must be refused with "Not in the docs"
#   must_include    substrings that must appear in the answer (case-insensitive)
#   expected_source path of the source that should be cited

